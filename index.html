  state.cardState[p.id] = { gaugeIdx: 0, colorIdx: 0, qty: hasGauges ? 10 : 1, justAdded: false };

function addToCart(item) {
  const existingIdx = state.cart.findIndex((it) => it.productId === item.productId && it.gauge === item.gauge && it.color === item.color);
  if (existingIdx >= 0) {
    state.cart[existingIdx] = { ...state.cart[existingIdx], qty: state.cart[existingIdx].qty + item.qty };
  } else {
    state.cart.push({ ...item, cartId: `${item.productId}-${item.gauge}-${item.color}-${Date.now()}` });
  }
  state.cartOpen = true;
}
function updateQty(cartId, qty) {
  const it = state.cart.find((i) => i.cartId === cartId);
  if (it) it.qty = qty;
}
function removeItem(cartId) {
  state.cart = state.cart.filter((i) => i.cartId !== cartId);
}
function cartTotal() {
  return state.cart.reduce((sum, it) => sum + it.qty * it.unitPrice, 0);
}
function cartCount() {
  return state.cart.reduce((sum, it) => sum + it.qty, 0);
}
function buildWhatsAppMessage() {
  const lines = state.cart.map((it, i) => {
    const specs = [it.gauge, it.color].filter(Boolean).join(", ");
    return `${i + 1}. ${it.name}${specs ? " (" + specs + ")" : ""} — ${it.qty} ${it.unit}${it.qty > 1 ? "s" : ""} @ ${kes(it.unitPrice)} = ${kes(it.qty * it.unitPrice)}`;
  });
  return `Hello ${BUSINESS_NAME}, I'd like to order:

` + lines.join("\n") + `\n\nTOTAL: ${kes(cartTotal())}\n\nPlease confirm availability and delivery to my location.`;
}

    const color = hasGauges ? product.colors[cs.colorIdx] : null;
    const key = `${gaugeLabel}|${color}`;
    if (product.photos[key]) return product.photos[key];
    if (product.photos.default) return product.photos.default;
  }
  return PRODUCT_IMAGES[product.icon] || PRODUCT_IMAGES.mabati;

function renderProductCard(product, index) {
  const cs = state.cardState[product.id];
  const hasGauges = !!product.gauges;
  const unitPrice = hasGauges ? product.gauges[cs.gaugeIdx].price : product.price;
  const priceRange = hasGauges ? [product.gauges[0].price, product.gauges[product.gauges.length - 1].price] : null;
  const imgSrc = getProductImage(product, cs);

  const gaugeColorBlock = hasGauges ? `
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-1 block">Gauge</label>
        <select data-product="${product.id}" data-role="gauge" class="w-full text-sm border border-gray-200 rounded-xl px-3 py-2 bg-gray-50 focus:outline-none focus:border-royal-red focus:ring-2 focus:ring-royal-red/10 transition-all cursor-pointer">
          ${product.gauges.map((g, i) => `<option value="${i}" ${i === cs.gaugeIdx ? "selected" : ""}>${escapeHtml(g.label)}</option>`).join("")}
        </select>
      </div>
      <div>
        <label class="text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-1 block">Color</label>
        <select data-product="${product.id}" data-role="color" class="w-full text-sm border border-gray-200 rounded-xl px-3 py-2 bg-gray-50 focus:outline-none focus:border-royal-red focus:ring-2 focus:ring-royal-red/10 transition-all cursor-pointer">
          ${product.colors.map((c, i) => `<option value="${i}" ${i === cs.colorIdx ? "selected" : ""}>${escapeHtml(c)}</option>`).join("")}
        </select>
      </div>
    </div>` : "";

  const rangeLine = priceRange ? `<div class="text-[11px] text-gray-400 font-medium">Range: ${kes(priceRange[0])} – ${kes(priceRange[1])}</div>` : "";

  const addBtnCls = cs.justAdded
    ? "bg-royal-charcoal text-white"
    : "bg-gradient-to-r from-royal-red to-royal-darkred text-white hover:shadow-lg hover:shadow-royal-red/25";
  const addBtnContent = cs.justAdded
    ? `${ICONS.check(16)} Added`
    : `<span>Add to Cart</span><span class="opacity-90">· ${kes(unitPrice * Math.max(1, cs.qty))}</span>`;

  const featuredBadge = product.featured ? `<div class="absolute top-3 left-3 bg-gradient-to-r from-royal-gold to-yellow-500 text-royal-charcoal text-[10px] font-bold uppercase tracking-wider px-3 py-1 rounded-full z-10 shadow-lg">Best Seller</div>` : "";

  return `
    <div class="product-card bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm flex flex-col scroll-reveal" style="transition-delay: ${index * 50}ms">
      <div class="relative h-48 w-full overflow-hidden bg-gray-100">
        ${featuredBadge}
        <img src="${imgSrc}" alt="${escapeHtml(product.name)}" loading="lazy" class="w-full h-full object-cover image-zoom" />
        <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
      </div>
      <div class="h-1 w-full ridge-pattern"></div>
      <div class="p-5 flex flex-col gap-3 flex-1">
        <div>
          <div class="flex items-start justify-between gap-2">
            <h3 class="font-display font-bold text-[15px] leading-snug text-royal-charcoal">${escapeHtml(product.name)}</h3>
          </div>
          <p class="text-[12.5px] text-gray-500 mt-1.5 line-clamp-2 leading-relaxed">${escapeHtml(product.description)}</p>
        </div>
        ${gaugeColorBlock}
        <div class="flex items-end justify-between mt-auto pt-2">
          <div>
            <div class="font-display font-bold text-xl text-royal-charcoal">
              ${kes(unitPrice)}<span class="text-[12px] font-normal text-gray-400"> /${product.unit}</span>
            </div>
            ${rangeLine}

          <div class="flex items-center border border-gray-200 rounded-full overflow-hidden bg-gray-50">
            <button data-product="${product.id}" data-role="qty-minus" class="px-3 py-2 text-gray-500 hover:text-royal-red hover:bg-white transition-colors" aria-label="Decrease quantity">${ICONS.minus(13)}</button>
            <input type="number" min="1" value="${cs.qty}" data-product="${product.id}" data-role="qty-input" class="w-10 text-center text-sm outline-none no-spinner bg-transparent font-semibold" />
            <button data-product="${product.id}" data-role="qty-plus" class="px-3 py-2 text-gray-500 hover:text-royal-red hover:bg-white transition-colors" aria-label="Increase quantity">${ICONS.plus(13)}</button>
          </div>
        </div>
        <button data-product="${product.id}" data-role="add-to-cart"

function renderMain() {
  const filtered = PRODUCTS.filter((p) => {
    const matchesCategory = state.activeCategory === "all" || p.category === state.activeCategory;
    const s = state.search.toLowerCase();
    const matchesSearch = !s || p.name.toLowerCase().includes(s) || p.description.toLowerCase().includes(s);
    return matchesCategory && matchesSearch;
  });

  if (filtered.length === 0) {
    return `
      <main id="products-section" class="max-w-7xl mx-auto px-4 pb-24">
        <div class="text-center py-24 text-gray-400">

          <p class="font-display text-lg text-gray-600">No products match your search.</p>
          <p class="text-sm mt-1">Try a different keyword or filter.</p>
        </div>
      </main>`;
  }

  const byCat = {};
  CATEGORIES.forEach((c) => (byCat[c.id] = []));
  filtered.forEach((p) => byCat[p.category].push(p));

  const sections = CATEGORIES.map((cat) => {
    const items = byCat[cat.id];
    if (!items || items.length === 0) return "";
    const catIcon = cat.id === 'mabati' ? ICONS.roof(20, "text-royal-red") : cat.id === 'cement' ? ICONS.shield(20, "text-royal-blue") : ICONS.zap(20, "text-royal-gold");
    return `
      <section class="mt-10 scroll-reveal">
        <div class="flex items-center gap-4 mb-6">
          <div class="w-12 h-12 rounded-2xl bg-white border border-gray-100 shadow-sm flex items-center justify-center">
            ${catIcon}

          <div>
            <h2 class="font-display font-bold text-2xl text-royal-charcoal uppercase tracking-tight">${escapeHtml(cat.label)}</h2>
            <div class="h-1 w-16 bg-gradient-to-r from-royal-red to-royal-gold rounded-full mt-1"></div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
          ${items.map((p, i) => renderProductCard(p, i)).join("")}
        </div>
      </section>`;
  }).join("");

  return `<main id="products-section" class="max-w-7xl mx-auto px-4 pb-24 pt-4">${sections}</main>`;
}

            <h4 class="font-display font-bold text-white text-sm uppercase tracking-wider mb-4">Contact Us</h4>
            <div class="flex flex-col gap-3 text-xs">
              <a href="https://wa.me/${WHATSAPP_NUMBER}" target="_blank" class="flex items-center gap-2 hover:text-royal-gold transition-colors">
                ${ICONS.chat(16, "text-royal-gold")} WhatsApp: +${WHATSAPP_NUMBER}
              </a>
              <div class="flex items-center gap-2">
                ${ICONS.truck(16, "text-royal-gold")} Countrywide Delivery Available
              </div>
            </div>
          </div>
        </div>
        <div class="border-t border-white/10 pt-6 text-center text-[11px]">
          © ${new Date().getFullYear()} ${escapeHtml(BUSINESS_NAME)}. Prices are indicative and confirmed on WhatsApp before delivery.
        </div>
      </div>
    </footer>`;
}

function render() {
  const root = document.getElementById("root");
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && "selectionStart" in active ? active.selectionStart : null;
  const selEnd = active && "selectionEnd" in active ? active.selectionEnd : null;

  root.innerHTML = `
    <div class="min-h-screen bg-royal-light">
      ${renderAnnouncementBar()}
      ${renderHeader()}
      ${renderHero()}
      ${renderFeatures()}
      ${renderFilterPills()}
      ${renderMain()}
      ${renderMobileCartButton()}
      ${renderCartDrawer()}
      ${renderFooter()}
    </div>`;

  attachHandlers();
  setupScrollObserver();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart != null && "setSelectionRange" in el) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

function attachHandlers() {
  const searchDesktop = document.getElementById("search-desktop");
  const searchMobile = document.getElementById("search-mobile");
  if (searchDesktop) searchDesktop.addEventListener("input", (e) => { state.search = e.target.value; render(); });
  if (searchMobile) searchMobile.addEventListener("input", (e) => { state.search = e.target.value; render(); });
  const clearDesktop = document.getElementById("clear-search-desktop");
  const clearMobile = document.getElementById("clear-search-mobile");
  if (clearDesktop) clearDesktop.addEventListener("click", () => { state.search = ""; render(); });
  if (clearMobile) clearMobile.addEventListener("click", () => { state.search = ""; render(); });

  const openCartBtn = document.getElementById("open-cart-btn");
  const closeCartBtn = document.getElementById("close-cart-btn");
  const cartOverlay = document.getElementById("cart-overlay");
  const mobileCartBtn = document.getElementById("mobile-cart-btn");
  if (openCartBtn) openCartBtn.addEventListener("click", () => { state.cartOpen = true; render(); });
  if (closeCartBtn) closeCartBtn.addEventListener("click", () => { state.cartOpen = false; render(); });
  if (cartOverlay) cartOverlay.addEventListener("click", () => { state.cartOpen = false; render(); });
  if (mobileCartBtn) mobileCartBtn.addEventListener("click", () => { state.cartOpen = true; render(); });

  document.querySelectorAll(".filter-pill").forEach((btn) => {
    btn.addEventListener("click", () => { state.activeCategory = btn.dataset.cat; render(); });
  });

  document.querySelectorAll('select[data-role="gauge"]').forEach((sel) => {
    sel.addEventListener("change", (e) => {
      state.cardState[sel.dataset.product].gaugeIdx = Number(e.target.value);
      render();
    });
  });
  document.querySelectorAll('select[data-role="color"]').forEach((sel) => {
    sel.addEventListener("change", (e) => {
      state.cardState[sel.dataset.product].colorIdx = Number(e.target.value);
      render();
    });
  });
  document.querySelectorAll('[data-role="qty-minus"]').forEach((btn) => {
    btn.addEventListener("click", () => {
      const product = PRODUCTS.find((p) => p.id === btn.dataset.product);
      const cs = state.cardState[btn.dataset.product];
      const step = product.gauges ? 5 : 1;
      cs.qty = Math.max(1, cs.qty - step);
      render();
    });
  });
  document.querySelectorAll('[data-role="qty-plus"]').forEach((btn) => {
    btn.addEventListener("click", () => {
      const product = PRODUCTS.find((p) => p.id === btn.dataset.product);
      const cs = state.cardState[btn.dataset.product];
      const step = product.gauges ? 5 : 1;
      cs.qty = cs.qty + step;
      render();
    });
  });
  document.querySelectorAll('input[data-role="qty-input"]').forEach((inp) => {
    inp.addEventListener("input", (e) => {
      const cs = state.cardState[inp.dataset.product];
      cs.qty = Math.max(1, Number(e.target.value) || 1);
      render();
    });
  });
  document.querySelectorAll('[data-role="add-to-cart"]').forEach((btn) => {
    btn.addEventListener("click", () => {
      const product = PRODUCTS.find((p) => p.id === btn.dataset.product);
      const cs = state.cardState[product.id];
      const hasGauges = !!product.gauges;
      const unitPrice = hasGauges ? product.gauges[cs.gaugeIdx].price : product.price;
      addToCart({
        productId: product.id, name: product.name, unit: product.unit,
        gauge: hasGauges ? product.gauges[cs.gaugeIdx].label : null,
        color: hasGauges ? product.colors[cs.colorIdx] : null,
        qty: Math.max(1, cs.qty), unitPrice,
      });
      cs.justAdded = true;
      render();
      setTimeout(() => { cs.justAdded = false; render(); }, 1200);
    });
  });

  document.querySelectorAll('[data-role="cart-qty-minus"]').forEach((btn) => {
    btn.addEventListener("click", () => {
      const it = state.cart.find((i) => i.cartId === btn.dataset.cartId);
      if (it) updateQty(it.cartId, Math.max(1, it.qty - 1));
      render();
    });
  });
  document.querySelectorAll('[data-role="cart-qty-plus"]').forEach((btn) => {
    btn.addEventListener("click", () => {
      const it = state.cart.find((i) => i.cartId === btn.dataset.cartId);
      if (it) updateQty(it.cartId, it.qty + 1);
      render();
    });
  });
  document.querySelectorAll('[data-role="cart-remove"]').forEach((btn) => {
    btn.addEventListener("click", () => { removeItem(btn.dataset.cartId); render(); });
  });

  const checkoutBtn = document.getElementById("checkout-btn");
  if (checkoutBtn) checkoutBtn.addEventListener("click", handleCheckout);
}

function setupScrollObserver() {
  const header = document.getElementById("main-header");
  if (!header) return;

  const observer = new IntersectionObserver(
    ([entry]) => {
      state.scrolled = !entry.isIntersecting;
      if (state.scrolled) {
        header.classList.remove("bg-transparent");
        header.classList.add("glass-dark", "shadow-xl", "shadow-black/20");
      } else {
        header.classList.add("bg-transparent");
        header.classList.remove("glass-dark", "shadow-xl", "shadow-black/20");
      }
    },
    { threshold: 0, rootMargin: "-80px 0px 0px 0px" }
  );

  const sentinel = document.createElement("div");
  sentinel.style.position = "absolute";
  sentinel.style.top = "0";
  sentinel.style.height = "1px";
  document.body.prepend(sentinel);
  observer.observe(sentinel);

  // Scroll reveal observer
  const revealObserver = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("visible");
        }
      });
    },
    { threshold: 0.1, rootMargin: "0px 0px -50px 0px" }
  );

  document.querySelectorAll(".scroll-reveal").forEach((el) => revealObserver.observe(el));
}

render();
</script>
</body>
</html>
