<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title> Royal Mabati</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  body { font-family: 'Inter', sans-serif; margin:0; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  input[type=number].no-spinner::-webkit-outer-spin-button,
  input[type=number].no-spinner::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number].no-spinner { -moz-appearance: textfield; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

/* ============================================================
   BRAND / BUSINESS CONFIG — change these to customize
   ============================================================ */
const BUSINESS_NAME = "Royal Mabati Hardware";
const BUSINESS_TAGLINE = "Foundation-grade materials, straight to site.";
const WHATSAPP_NUMBER = "254700000000"; // digits only, country code, no +

/* ============================================================
   PRODUCT DATA
   ============================================================ */
const CATEGORIES = [
  { id: "mabati", label: "Mabati (Roofing)" },
  { id: "cement", label: "Cement" },
  { id: "steel", label: "Steel & Hardware" },

const TILE_COLORS = ["Red", "Blue", "Green", "Charcoal"];

const PRODUCTS = [
  {
    id: "royal-zee-tile", category: "mabati",
    name: "Royal Zee Tile / Brick Tile",
    description: "Tile-profile roofing sheet with a bold brick-pattern press. Popular for residential roofs wanting a tiled look without the tile weight.",
    unit: "metre", icon: "mabati",
    gauges: [{ label: "Gauge 30", price: 491 }, { label: "Gauge 28", price: 550 }],
    colors: TILE_COLORS,
  },
  {
    id: "box-profile", category: "mabati",
    name: "Box Profile Mabati (Heritage / Royal style)",
    description: "Deep box-rib profile for strong water runoff and a clean modern roofline. Our most-ordered profile for both homes and go-downs.",
    unit: "metre", icon: "mabati",
    gauges: [{ label: "Gauge 30", price: 500 }, { label: "Gauge 28", price: 550 }],
    colors: TILE_COLORS,
  },
  {
    id: "corrugated", category: "mabati",
    name: "Corrugated / Ordinary Galvanized Mabati",
    description: "The classic wave-profile galvanized sheet. Budget-friendly, dependable, and the standard for stores, fences and simple roofs.",
    unit: "metre", icon: "mabati",
    gauges: [{ label: "Gauge 30", price: 300 }, { label: "Gauge 28", price: 350 }],
    colors: ["Galvanized Silver"],
  },
  {
    id: "roman-longtile", category: "mabati",
    name: "Roman LongTile / EuroTile",
    description: "Premium long-span tile profile with deep shadow lines for a high-end finish. Fewer overlaps needed thanks to the extended run.",
    unit: "metre", icon: "mabati",

    colors: TILE_COLORS,
  },
  {
    id: "simba-325r", category: "cement",
    name: "Simba Cement 32.5R",
    description: "General-purpose masonry cement for blockwork, plastering and rendering. The everyday bag for standard construction.",
    unit: "bag", icon: "cement", price: 550,
  },
  {
    id: "simba-power-425n", category: "cement",
    name: "Simba Power Portland Cement 42.5N",
    description: "High early-strength Portland cement for structural concrete, columns, slabs and foundations that need to gain strength fast.",
    unit: "bag", icon: "cement", price: 640,
  },
  {
    id: "d8-bar", category: "steel",
    name: "Deformed Building Bar — D8",
    description: "8mm deformed reinforcement bar for light slabs, lintels and secondary reinforcement.",
    unit: "piece", icon: "rebar", price: 450,
  },
  {
    id: "d10-bar", category: "steel",
    name: "Deformed Building Bar — D10",
    description: "10mm deformed reinforcement bar, a common choice for columns and beams in residential builds.",
    unit: "piece", icon: "rebar", price: 750,
  },
  {
    id: "d12-bar", category: "steel",
    name: "Deformed Building Bar — D12",
    description: "12mm deformed reinforcement bar for heavier structural work and load-bearing elements.",
    unit: "piece", icon: "rebar", price: 1050,
  },
  {
    id: "binding-wire", category: "steel",
    name: "Binding Wire",
    description: "Soft-drawn tying wire for fixing rebar cages before casting. Full roll.",
    unit: "roll", icon: "wire", price: 2900,
  },
];

/* ============================================================
   PRODUCT PHOTOS — real photography, Unsplash License
   (free for commercial use, no attribution required)
   Swap these URLs for your own stock photos any time.
   ============================================================ */
const PRODUCT_IMAGES = {
  mabati: "https://images.unsplash.com/photo-1706029831375-c090c70c161d?fm=jpg&q=80&w=800&auto=format&fit=crop",
  cement: "https://images.unsplash.com/photo-1560435650-7ec2e17ba926?fm=jpg&q=80&w=800&auto=format&fit=crop",
  rebar: "https://images.unsplash.com/photo-1763771420303-0f11ccf613d1?fm=jpg&q=80&w=800&auto=format&fit=crop",
  wire: "https://images.unsplash.com/photo-1727670404457-9c5497d58fad?fm=jpg&q=80&w=800&auto=format&fit=crop",
};

/* ============================================================
   HELPERS
   ============================================================ */
const kes = (n) => "KSh " + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");

/* Minimal inline icon set — no external icon library needed */
const Icon = ({ path, size = 18, className = "", strokeWidth = 2 }) => (
  <svg viewBox="0 0 24 24" width={size} height={size} className={className} fill="none"
       stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
    {path}
  </svg>
);
const SearchIcon = (p) => <Icon {...p} path={<><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>} />;
const XIcon = (p) => <Icon {...p} path={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} />;
const PlusIcon = (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />;
const MinusIcon = (p) => <Icon {...p} path={<line x1="5" y1="12" x2="19" y2="12"/>} />;
const CartIcon = (p) => <Icon {...p} path={<><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></>} />;
const ChatIcon = (p) => <Icon {...p} path={<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>} />;
const TrashIcon = (p) => <Icon {...p} path={<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></>} />;
const CheckIcon = (p) => <Icon {...p} path={<polyline points="20 6 9 17 4 12"/>} />;
const TruckIcon = (p) => <Icon {...p} path={<><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></>} />;
const ShieldIcon = (p) => <Icon {...p} path={<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>} />;

/* Ridge texture strip — the signature visual motif (corrugated profile) */
function RidgeStrip({ className = "", height = 10 }) {
  return (
    <div className={className} style={{ height, backgroundImage:
      "repeating-linear-gradient(90deg, rgba(0,0,0,0.28) 0px, rgba(0,0,0,0.28) 2px, rgba(255,255,255,0.10) 2px, rgba(255,255,255,0.10) 5px, rgba(0,0,0,0.05) 5px, rgba(0,0,0,0.05) 9px)" }} />
  );
}

function AnnouncementBar() {
  return (
    <div className="bg-[#161a1d] text-[#e8590c] text-[12px] sm:text-[13px] tracking-wide font-semibold">
      <div className="max-w-7xl mx-auto px-3 py-2 flex items-center justify-center gap-2 text-center">
        <TruckIcon size={14} className="shrink-0" />
        <span className="uppercase font-['Oswald'] tracking-[0.06em]">Fast countrywide delivery &nbsp;•&nbsp; Quality-certified hardware</span>
        <ShieldIcon size={14} className="shrink-0" />
      </div>
    </div>
  );
}

function Header({ search, setSearch, cartCount, onOpenCart }) {
  return (
    <header className="sticky top-0 z-30 bg-[#1c1f22] text-[#f2efe9] shadow-lg shadow-black/20">
      <RidgeStrip height={5} />
      <div className="max-w-7xl mx-auto px-4 py-4 flex items-center gap-4">
        <div className="flex flex-col leading-tight shrink-0">
          <span className="font-['Oswald'] font-bold text-xl sm:text-2xl tracking-tight uppercase">{BUSINESS_NAME}</span>
          <span className="text-[11px] sm:text-xs text-[#9aa4ac] font-medium">{BUSINESS_TAGLINE}</span>
        </div>
        <div className="flex-1 hidden sm:flex items-center bg-[#2a2f34] rounded-full px-4 py-2.5 gap-2 border border-white/5 focus-within:border-[#e8590c]/60 transition-colors">
          <SearchIcon size={17} className="text-[#9aa4ac] shrink-0" />
          <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search mabati, cement, bars..."
                 className="bg-transparent outline-none text-sm placeholder:text-[#7a838a] w-full" />
          {search && <button onClick={() => setSearch("")} aria-label="Clear search"><XIcon size={15} className="text-[#9aa4ac] hover:text-white" /></button>}
        </div>
        <button onClick={onOpenCart} className="relative flex items-center gap-2 bg-[#e8590c] hover:bg-[#d14e08] active:scale-95 transition-all rounded-full px-4 py-2.5 font-semibold text-sm shrink-0">
          <CartIcon size={18} />
          <span className="hidden sm:inline">Cart</span>
          {cartCount > 0 && <span className="absolute -top-2 -right-2 bg-[#1c1f22] text-[#e8590c] border-2 border-[#e8590c] text-[11px] font-bold rounded-full w-5 h-5 flex items-center justify-center">{cartCount}</span>}
        </button>
      </div>
      <div className="sm:hidden px-4 pb-3">
        <div className="flex items-center bg-[#2a2f34] rounded-full px-4 py-2.5 gap-2 border border-white/5">
          <SearchIcon size={16} className="text-[#9aa4ac] shrink-0" />
          <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search mabati, cement, bars..."
                 className="bg-transparent outline-none text-sm placeholder:text-[#7a838a] w-full text-[#f2efe9]" />
          {search && <button onClick={() => setSearch("")} aria-label="Clear search"><XIcon size={15} className="text-[#9aa4ac]" /></button>}
        </div>
      </div>
    </header>
  );
}

function FilterPills({ active, setActive }) {
  const all = [{ id: "all", label: "All Products" }, ...CATEGORIES];
  return (
    <div className="max-w-7xl mx-auto px-4 pt-5 pb-1">
      <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
        {all.map((c) => {
          const isActive = active === c.id;
          return (
            <button key={c.id} onClick={() => setActive(c.id)}
              className={"shrink-0 px-4 py-2 rounded-full text-sm font-semibold font-['Oswald'] tracking-wide uppercase transition-all border " +
                (isActive ? "bg-[#1c1f22] text-white border-[#1c1f22]" : "bg-white text-[#4a5560] border-[#d8d3c8] hover:border-[#1c1f22]")}>
              {c.label}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function ProductCard({ product, onAdd }) {
  const hasGauges = !!product.gauges;
  const [gaugeIdx, setGaugeIdx] = useState(0);
  const [colorIdx, setColorIdx] = useState(0);
  const [qty, setQty] = useState(hasGauges ? 10 : 1);
  const [justAdded, setJustAdded] = useState(false);

  const unitPrice = hasGauges ? product.gauges[gaugeIdx].price : product.price;
  const priceRange = hasGauges ? [product.gauges[0].price, product.gauges[product.gauges.length - 1].price] : null;

  const handleAdd = () => {
    onAdd({
      productId: product.id, name: product.name, unit: product.unit,
      gauge: hasGauges ? product.gauges[gaugeIdx].label : null,
      color: hasGauges ? product.colors[colorIdx] : null,
      qty: Math.max(1, qty), unitPrice,
    });
    setJustAdded(true);
    setTimeout(() => setJustAdded(false), 1200);
  };

  return (
    <div className="bg-white rounded-2xl overflow-hidden border border-[#e5e0d5] shadow-sm hover:shadow-md transition-shadow flex flex-col">
      <div className="h-36 w-full overflow-hidden">
        <img src={PRODUCT_IMAGES[product.icon]} alt={product.name} loading="lazy" className="w-full h-full object-cover" />
      </div>
      <RidgeStrip height={6} />
      <div className="p-4 flex flex-col gap-3 flex-1">
        <div>
          <h3 className="font-['Oswald'] font-semibold text-[15px] leading-snug text-[#1c1f22]">{product.name}</h3>
          <p className="text-[12.5px] text-[#767f86] mt-0.5 line-clamp-2">{product.description}</p>
        </div>

        {hasGauges && (
          <div className="grid grid-cols-2 gap-2">
            <div>
              <label className="text-[10.5px] font-bold uppercase tracking-wide text-[#9aa4ac]">Gauge</label>
              <select value={gaugeIdx} onChange={(e) => setGaugeIdx(Number(e.target.value))}
                className="w-full mt-1 text-sm border border-[#d8d3c8] rounded-lg px-2 py-1.5 bg-[#faf9f6] focus:outline-none focus:border-[#e8590c]">
                {product.gauges.map((g, i) => <option key={g.label} value={i}>{g.label}</option>)}
              </select>
            </div>
            <div>
              <label className="text-[10.5px] font-bold uppercase tracking-wide text-[#9aa4ac]">Color</label>
              <select value={colorIdx} onChange={(e) => setColorIdx(Number(e.target.value))}
                className="w-full mt-1 text-sm border border-[#d8d3c8] rounded-lg px-2 py-1.5 bg-[#faf9f6] focus:outline-none focus:border-[#e8590c]">
                {product.colors.map((c, i) => <option key={c} value={i}>{c}</option>)}
              </select>
            </div>
          </div>
        )}

        <div className="flex items-end justify-between mt-auto pt-1">
          <div>
            <div className="font-['Oswald'] font-bold text-lg text-[#1c1f22]">
              {kes(unitPrice)}<span className="text-[12px] font-normal text-[#9aa4ac]"> /{product.unit}</span>
            </div>
            {priceRange && <div className="text-[11px] text-[#9aa4ac]">Range: {kes(priceRange[0])} – {kes(priceRange[1])}</div>}
          </div>
          <div className="flex items-center border border-[#d8d3c8] rounded-full overflow-hidden">
            <button onClick={() => setQty((q) => Math.max(1, q - (hasGauges ? 5 : 1)))} className="px-2.5 py-1.5 text-[#4a5560] hover:bg-[#f2efe9]" aria-label="Decrease quantity"><MinusIcon size={14} /></button>
            <input type="number" min={1} value={qty} onChange={(e) => setQty(Math.max(1, Number(e.target.value) || 1))} className="w-12 text-center text-sm outline-none no-spinner" />
            <button onClick={() => setQty((q) => q + (hasGauges ? 5 : 1))} className="px-2.5 py-1.5 text-[#4a5560] hover:bg-[#f2efe9]" aria-label="Increase quantity"><PlusIcon size={14} /></button>
          </div>
        </div>

        <button onClick={handleAdd}
          className={"w-full mt-1 rounded-xl py-2.5 font-['Oswald'] font-semibold text-sm uppercase tracking-wide transition-all flex items-center justify-center gap-2 " +
            (justAdded ? "bg-[#1c1f22] text-white" : "bg-[#e8590c] hover:bg-[#d14e08] text-white active:scale-[0.98]")}>
          {justAdded ? <><CheckIcon size={16} /> Added to cart</> : <>Add to Cart · {kes(unitPrice * Math.max(1, qty))}</>}
        </button>
      </div>
    </div>
  );
}

function CartDrawer({ open, onClose, items, updateQty, removeItem, total }) {
  const buildWhatsAppMessage = () => {
    const lines = items.map((it, i) => {
      const specs = [it.gauge, it.color].filter(Boolean).join(", ");
      return `${i + 1}. ${it.name}${specs ? " (" + specs + ")" : ""} — ${it.qty} ${it.unit}${it.qty > 1 ? "s" : ""} @ ${kes(it.unitPrice)} = ${kes(it.qty * it.unitPrice)}`;
    });
    return `Hello ${BUSINESS_NAME}, I'd like to order:\n\n` + lines.join("\n") + `\n\nTOTAL: ${kes(total)}\n\nPlease confirm availability and delivery to my location.`;
  };
  const handleCheckout = () => {
    const text = encodeURIComponent(buildWhatsAppMessage());
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${text}`, "_blank");
  };

  return (
    <>
      <div onClick={onClose} className={"fixed inset-0 bg-black/50 z-40 transition-opacity " + (open ? "opacity-100 pointer-events-auto" : "opacity-0 pointer-events-none")} />
      <div className={"fixed top-0 right-0 h-full w-full sm:w-[420px] bg-[#faf9f6] z-50 shadow-2xl flex flex-col transition-transform duration-300 " + (open ? "translate-x-0" : "translate-x-full")}>
        <div className="bg-[#1c1f22] text-white px-5 py-4 flex items-center justify-between">
          <h2 className="font-['Oswald'] font-bold uppercase tracking-wide flex items-center gap-2"><CartIcon size={19} /> Your Cart</h2>
          <button onClick={onClose} aria-label="Close cart"><XIcon size={20} /></button>
        </div>
        <RidgeStrip height={5} />
        <div className="flex-1 overflow-y-auto px-5 py-4 flex flex-col gap-3">
          {items.length === 0 && (
            <div className="text-center text-[#9aa4ac] mt-16 flex flex-col items-center gap-2">
              <CartIcon size={36} strokeWidth={1.2} />
              <p className="text-sm">Your cart is empty. Add some materials to get a quote.</p>
            </div>
          )}
          {items.map((it) => (
            <div key={it.cartId} className="bg-white rounded-xl border border-[#e5e0d5] p-3 flex gap-3">
              <div className="flex-1 min-w-0">
                <div className="font-['Oswald'] font-semibold text-[13.5px] text-[#1c1f22] leading-snug">{it.name}</div>
                {(it.gauge || it.color) && <div className="text-[11.5px] text-[#767f86] mt-0.5">{[it.gauge, it.color].filter(Boolean).join(" · ")}</div>}
                <div className="flex items-center gap-2 mt-2">
                  <div className="flex items-center border border-[#d8d3c8] rounded-full overflow-hidden">
                    <button onClick={() => updateQty(it.cartId, Math.max(1, it.qty - 1))} className="px-2 py-1 text-[#4a5560] hover:bg-[#f2efe9]"><MinusIcon size={12} /></button>
                    <span className="w-8 text-center text-xs font-medium">{it.qty}</span>
                    <button onClick={() => updateQty(it.cartId, it.qty + 1)} className="px-2 py-1 text-[#4a5560] hover:bg-[#f2efe9]"><PlusIcon size={12} /></button>
                  </div>
                  <span className="text-[11px] text-[#9aa4ac]">{it.unit}s</span>
                </div>
              </div>
              <div className="flex flex-col items-end justify-between shrink-0">
                <button onClick={() => removeItem(it.cartId)} className="text-[#c4453a] hover:text-[#9c332a]" aria-label="Remove item"><TrashIcon size={16} /></button>
                <span className="font-['Oswald'] font-semibold text-sm text-[#1c1f22]">{kes(it.qty * it.unitPrice)}</span>
              </div>
            </div>
          ))}
        </div>
        {items.length > 0 && (
          <div className="border-t border-[#e5e0d5] bg-white px-5 py-4">
            <div className="flex items-center justify-between mb-3">
              <span className="font-['Oswald'] uppercase tracking-wide text-sm text-[#4a5560]">Total</span>
              <span className="font-['Oswald'] font-bold text-xl text-[#1c1f22]">{kes(total)}</span>
            </div>
            <button onClick={handleCheckout} className="w-full bg-[#25D366] hover:bg-[#1fb857] active:scale-[0.98] transition-all text-white rounded-xl py-3 font-['Oswald'] font-semibold uppercase tracking-wide flex items-center justify-center gap-2">
              <ChatIcon size={19} /> Checkout via WhatsApp
            </button>
            <p className="text-[11px] text-center text-[#9aa4ac] mt-2">Opens WhatsApp with your itemized order to confirm with our team.</p>
          </div>
        )}
      </div>
    </>
  );
}

function App() {
  const [search, setSearch] = useState("");
  const [activeCategory, setActiveCategory] = useState("all");
  const [cartOpen, setCartOpen] = useState(false);
  const [cart, setCart] = useState([]);

  const filteredProducts = useMemo(() => PRODUCTS.filter((p) => {
    const matchesCategory = activeCategory === "all" || p.category === activeCategory;
    const matchesSearch = !search || p.name.toLowerCase().includes(search.toLowerCase()) || p.description.toLowerCase().includes(search.toLowerCase());
    return matchesCategory && matchesSearch;
  }), [activeCategory, search]);

  const grouped = useMemo(() => {
    const byCat = {};
    CATEGORIES.forEach((c) => (byCat[c.id] = []));
    filteredProducts.forEach((p) => byCat[p.category].push(p));
    return byCat;
  }, [filteredProducts]);

  const addToCart = (item) => {
    setCart((prev) => {
      const existingIdx = prev.findIndex((it) => it.productId === item.productId && it.gauge === item.gauge && it.color === item.color);
      if (existingIdx >= 0) {
        const copy = [...prev];
        copy[existingIdx] = { ...copy[existingIdx], qty: copy[existingIdx].qty + item.qty };
        return copy;
      }
      return [...prev, { ...item, cartId: `${item.productId}-${item.gauge}-${item.color}-${Date.now()}` }];
    });
    setCartOpen(true);
  };
  const updateQty = (cartId, qty) => setCart((prev) => prev.map((it) => (it.cartId === cartId ? { ...it, qty } : it)));
  const removeItem = (cartId) => setCart((prev) => prev.filter((it) => it.cartId !== cartId));

  const total = cart.reduce((sum, it) => sum + it.qty * it.unitPrice, 0);
  const cartCount = cart.reduce((sum, it) => sum + it.qty, 0);

  return (
    <div className="min-h-screen bg-[#f2efe9]">
      <AnnouncementBar />
      <Header search={search} setSearch={setSearch} cartCount={cartCount} onOpenCart={() => setCartOpen(true)} />
      <FilterPills active={activeCategory} setActive={setActiveCategory} />
      <main className="max-w-7xl mx-auto px-4 pb-24">
        {filteredProducts.length === 0 && (
          <div className="text-center py-24 text-[#9aa4ac]">
            <p className="font-['Oswald'] text-lg">No products match your search.</p>
            <p className="text-sm mt-1">Try a different keyword or filter.</p>
          </div>
        )}
        {CATEGORIES.map((cat) => {
          const items = grouped[cat.id];
          if (!items || items.length === 0) return null;
          return (
            <section key={cat.id} className="mt-8">
              <div className="flex items-center gap-3 mb-4">
                <h2 className="font-['Oswald'] font-bold text-xl sm:text-2xl text-[#1c1f22] uppercase tracking-tight">{cat.label}</h2>
                <div className="h-[3px] flex-1 rounded-full bg-[#e5e0d5]" />
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                {items.map((p) => <ProductCard key={p.id} product={p} onAdd={addToCart} />)}
              </div>
            </section>
          );
        })}
      </main>
      {cartCount > 0 && (
        <button onClick={() => setCartOpen(true)} className="sm:hidden fixed bottom-5 right-5 z-30 bg-[#e8590c] text-white rounded-full shadow-lg shadow-black/30 px-5 py-3.5 flex items-center gap-2 font-['Oswald'] font-semibold">
          <CartIcon size={18} />{kes(total)}
        </button>
      )}
      <CartDrawer open={cartOpen} onClose={() => setCartOpen(false)} items={cart} updateQty={updateQty} removeItem={removeItem} total={total} />
      <footer className="bg-[#1c1f22] text-[#9aa4ac] text-center py-6 text-xs">
        <RidgeStrip height={6} className="mb-6" />
        © {new Date().getFullYear()} {BUSINESS_NAME}. Prices are indicative and confirmed on WhatsApp before delivery.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
